# Prometheus configuration for DORA Platform (Production)
# Scrapes metrics from API and Worker

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'dora-platform'
    environment: '${APP_ENV:-prod}'

scrape_configs:
  - job_name: 'dora-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'dora-worker'
    static_configs:
      - targets: ['worker:8000']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
