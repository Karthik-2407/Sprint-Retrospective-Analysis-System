repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        args: [--strict, -m, dora_platform]
        additional_dependencies: ["types-requests", "dora-platform @ file:///C:/Users/ACER/Documents/ASE"]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/pycqa/bandit
    rev: 1.7.0
    hooks:
      - id: bandit
        args: [-r, src/dora_platform]
        additional_dependencies: ["pbr"]
        pass_filenames: false

ci:
  autofix_commit_msg_style: "chore: pre-commit autofix"
  autofix_prereqs: [uv]
  autoupdate_commit_msg_style: "chore: pre-commit autoupdate"
  autoupdate_schedule: weekly
